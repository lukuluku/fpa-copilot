name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: fpacopilotregistry.azurecr.io
  RESOURCE_GROUP: fpa-copilot-rg
  BACKEND_APP: fpa-copilot-backend
  FRONTEND_APP: fpa-copilot-frontend
  BACKEND_IMAGE: fpa-copilot-backend
  FRONTEND_IMAGE: fpa-copilot-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Container Registry
        run: |
          az acr login --name fpacopilotregistry

      - name: Build and push backend image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest \
            -f backend/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest \
            -f frontend/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest

      - name: Deploy backend to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Deploy frontend to Container Apps
        run: |
          BACKEND_URL=$(az containerapp show \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)

          az containerapp update \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest \
            --set-env-vars NEXT_PUBLIC_API_URL="https://$BACKEND_URL"

      - name: Verify deployment
        run: |
          BACKEND_URL=$(az containerapp show \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)

          FRONTEND_URL=$(az containerapp show \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)

          echo "Backend: https://$BACKEND_URL"
          echo "Frontend: https://$FRONTEND_URL"

          # Wait for services to be ready
          sleep 10

          # Test backend health
          curl -f "https://$BACKEND_URL/status" || exit 1

          echo "Deployment successful!"

      - name: Log deployment summary
        if: always()
        run: |
          echo "Deployment Summary"
          echo "=================="
          echo "Backend: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest"
          echo "Frontend: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest"
          echo "Resource Group: ${{ env.RESOURCE_GROUP }}"
